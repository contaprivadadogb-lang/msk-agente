<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lovafash Chat</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 360px;
        height: 520px;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fcfbf8;
        color: #26221d;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #f26b5e;
        color: #fff;
      }
      header img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #fff;
        padding: 2px;
      }
      header h1 {
        font-size: 15px;
        font-weight: 700;
      }
      header p {
        font-size: 11px;
        opacity: 0.9;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 82%;
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #26221d;
        color: #fcfbf8;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: #f1ede4;
        color: #26221d;
        border-bottom-left-radius: 4px;
      }
      .msg.error {
        align-self: center;
        background: #fdecea;
        color: #b3261e;
        font-size: 12px;
      }
      .msg.sent {
        align-self: center;
        background: transparent;
        border: 1px dashed #f26b5e;
        color: #d9534a;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
      }
      .msg.typing {
        align-self: flex-start;
        background: #f1ede4;
        color: #8a8378;
        font-style: italic;
      }
      #empty {
        margin: auto;
        text-align: center;
        color: #8a8378;
        font-size: 13px;
        padding: 0 24px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #e8e2d6;
        background: #fff;
      }
      #input {
        flex: 1;
        resize: none;
        border: 1px solid #e8e2d6;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        background: #fcfbf8;
        color: #26221d;
        outline: none;
        height: 42px;
      }
      #input:focus {
        border-color: #f26b5e;
      }
      button {
        border: none;
        border-radius: 10px;
        background: #f26b5e;
        color: #fff;
        width: 42px;
        height: 42px;
        cursor: pointer;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icon.png" alt="Lovafash" />
      <div>
        <h1>Lovafash Chat</h1>
        <p>Resposta automática, 24 horas</p>
      </div>
    </header>
    <div id="messages">
      <div id="empty">Digite sua mensagem abaixo e envie.<br />O Lovafash responde na hora.</div>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Digite sua mensagem..." rows="1"></textarea>
      <button type="submit" id="send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z" />
          <path d="M22 2 11 13" />
        </svg>
      </button>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
